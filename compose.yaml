services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_management}
      POSTGRES_USER: ${POSTGRES_USER:-store_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - store_management_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-store_user} -d ${POSTGRES_DB:-store_management}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  store_management_pgdata:
